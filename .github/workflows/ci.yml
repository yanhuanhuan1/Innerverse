name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-consistency:
    name: Build consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build canvas chunks (must be reproducible)
        run: npm run build
      - name: Verify build artifacts match source (hashes + manifest + canvas.html)
        run: node scripts/check-build-consistency.mjs
      - name: Fail if the build produced uncommitted changes
        run: |
          if ! git diff --exit-code -- static/js/build static/canvas.html; then
            echo "::error::Build artifacts are stale. Run 'npm run build' locally and commit the regenerated static/js/build and static/canvas.html."
            exit 1
          fi
      - name: Frontend syntax checks
        run: |
          for f in static/js/canvas.js static/js/canvas-lightbox.js static/js/canvas-logs.js static/js/canvas-export.js static/js/canvas-workflows.js static/js/canvas-node-renderers.js static/js/canvas-media.js static/js/home.js static/js/build/canvas-core.js; do
            node --check "$f"
          done

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  smoke:
    name: Local smoke (assets + API + cache headers)
    runs-on: ubuntu-latest
    needs: [build-consistency, backend-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Start server
        run: |
          DEV_AUTH_BYPASS=1 nohup python main.py > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready"
          tail -n 50 server.log || true
          exit 1
      - name: Run smoke checks
        run: node scripts/smoke.mjs http://127.0.0.1:3000
      - name: Verify python dependencies import cleanly
        run: python -c "import main; print('main import OK')"
