<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方寸万象</title>
    <script>
        (function(){
            try {
                localStorage.setItem('studio_active_page', 'home');
                if(window.parent && window.parent !== window && typeof window.parent.switchUI === 'function') {
                    window.parent.switchUI(null, 'home', { homeSection:'projects' });
                    return;
                }
            } catch(e) {}
            window.location.replace('/?section=projects');
        })();
    </script>
</head>
<body></body>
</html>
