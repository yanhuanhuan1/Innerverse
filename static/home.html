<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>方寸万象</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.23.1784878252"></script>
    <script src="/static/js/theme.js?v=2026.07.23.1784878252"></script>
    <script src="/static/js/i18n.js?v=2026.07.23.1785744093"></script>
    <link rel="stylesheet" href="/static/css/home.css?v=2026.08.10.2">
</head>
<body>
    <div class="home-page">
        <header class="home-topbar">
            <div class="topbar-actions">
                <button id="emailLoginBtn" class="auth-login" type="button" title="登录" aria-label="登录" hidden><i data-lucide="mail"></i><span>登录</span></button>
                <div class="user-entry">
                    <button id="homeUserBox" class="user-chip" type="button" aria-haspopup="menu" aria-expanded="false" hidden>
                        <img id="homeUserAvatar" alt="" />
                        <span id="homeUserName">用户</span>
                        <i data-lucide="chevron-down" class="user-chevron"></i>
                    </button>
                    <div id="homeUserMenu" class="user-menu" hidden>
                        <button id="homeThemeBtn" class="user-menu-item" type="button" title="切换主题" aria-label="切换主题"><i data-lucide="moon"></i><span>切换主题</span></button>
                        <button id="homeLanguageBtn" class="user-menu-item" type="button" title="切换语言" aria-label="切换语言"><i data-lucide="languages"></i><span>中文</span></button>
                        <div class="user-menu-sep"></div>
                        <button id="homeLogoutBtn" class="user-menu-item danger" type="button" title="退出登录" aria-label="退出登录"><i data-lucide="log-out"></i><span>退出登录</span></button>
                    </div>
                </div>
            </div>
        </header>

        <main class="home-main">
            <section class="home-hero">
                <div class="brand-head">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <h1 class="hero-title">方寸万象</h1>
                </div>
                <p class="hero-sub">你的智能创作助手，帮你完成从灵感到视觉成果</p>

                <form id="promptForm" class="prompt-card" novalidate>
                    <textarea id="homePrompt" rows="2" placeholder="描述你想创作的内容，或将图片和文件拖到这里"></textarea>
                    <div class="prompt-actions">
                        <div class="prompt-left">
                            <button id="attachBtn" class="ghost-action" type="button"><i data-lucide="paperclip"></i><span>上传素材</span></button>
                            <a id="assetLibraryLink" class="asset-library-link" href="/static/asset-manager.html?v=2026.07.23.1785828569" hidden>素材库</a>
                        </div>
                        <div class="prompt-right">
                            <span id="uploadStatus" class="upload-status" hidden></span>
                            <button id="startBtn" class="start-btn" type="submit"><span>使用 AI 创建</span><i data-lucide="arrow-up-right"></i></button>
                        </div>
                    </div>
                    <div id="dropHint" class="drop-hint" role="status" hidden>松开以上传素材</div>
                </form>

                <div id="quickTags" class="quick-tags" role="group" aria-label="快捷创作"></div>
            </section>

            <section class="recent-section" id="recentSection" aria-labelledby="recentHeading">
                <div class="section-head">
                    <h2 id="recentHeading">最近项目</h2>
                </div>
                <div id="recentGrid" class="recent-grid"></div>
                <div id="recentEmpty" class="recent-empty" hidden></div>
                <div id="recentStatus" class="recent-status" hidden>
                    <p id="recentErrorText">项目加载失败</p>
                    <button id="recentRetryBtn" type="button">重新加载</button>
                </div>
            </section>
        </main>

        <div id="homeStatus" class="home-toast"></div>
        <div id="emailLoginModal" class="auth-modal" hidden>
            <div class="auth-modal-backdrop" data-close-email-login></div>
            <form id="emailLoginForm" class="auth-card">
                <button class="auth-close" type="button" data-close-email-login aria-label="关闭"><i data-lucide="x"></i></button>
                <h3 id="authTitle">邮箱登录</h3>
                <p id="authDesc">使用邮箱和密码登录。第一次使用请先注册账号。</p>
                <div class="auth-tabs" role="tablist" aria-label="登录方式">
                    <button id="authLoginTab" class="active" type="button">登录</button>
                    <button id="authRegisterTab" type="button">注册</button>
                </div>
                <label id="authNameLabel" hidden>
                    <span>用户名</span>
                    <input id="loginNameInput" type="text" autocomplete="nickname" placeholder="给自己取一个名字">
                </label>
                <label>
                    <span>邮箱</span>
                    <input id="loginEmailInput" type="email" autocomplete="email" placeholder="name@example.com" required>
                </label>
                <label>
                    <span>密码</span>
                    <input id="loginPasswordInput" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="至少 8 位密码" required>
                </label>
                <div id="authCodeFields" class="auth-code-row" hidden>
                    <label>
                        <span>验证码</span>
                        <input id="loginCodeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码">
                    </label>
                    <button id="sendEmailCodeBtn" type="button">获取验证码</button>
                </div>
                <button id="verifyEmailCodeBtn" class="auth-submit" type="submit">登录</button>
                <button id="emailCodeFallbackBtn" class="auth-link-btn" type="button">使用邮箱验证码登录</button>
                <div id="emailLoginHint" class="auth-hint"></div>
            </form>
        </div>
    </div>
    <script src="/static/js/home.js?v=2026.08.10.2"></script>
</body>
</html>
